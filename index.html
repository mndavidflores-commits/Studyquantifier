<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Estudio v28</title>
  <link rel="manifest" href="data:application/json;base64,...">
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="app-container">
  <!-- Auth section (opcional, se puede mantener oculta durante la sesión) -->
  <div id="auth-section">
    <span id="auth-status">Cargando...</span>
    <button id="btn-login" style="display:none;">Iniciar sesión con Google</button>
    <button id="btn-logout" style="display:none;">Cerrar sesión</button>
  </div>

  <div id="app-content" style="display:none;">
    <!-- BARRA SUPERIOR (visible solo en IDLE) -->
    <header id="topbar">
      <div class="brand">
        <div class="app-name">studyquantifier</div>
        <div id="user-email" class="user-email">No has iniciado sesión</div>
      </div>
      <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-panel="panelSesion">Sesión</button>
        <button class="tab-btn" data-panel="panelHistorial">Historial</button>
        <button class="tab-btn" data-panel="panelProgreso">Progreso</button>
        <button class="tab-btn" data-panel="panelMetricas">Métricas</button>
        <button class="tab-btn" data-panel="panelSueno">Sueño</button>
        <button class="tab-btn" data-panel="panelConjeturas">Conjeturas</button>
        <button class="tab-btn" data-panel="panelChecklist">Checklist</button>
        <button class="tab-btn" data-panel="panelMetas">Metas</button>
        <button class="tab-btn" data-panel="panelDominio">Dominio</button>
      </nav>
      <div class="topbar-icons">
        <button id="btnExport" title="Exportar">⬇</button>
        <button id="btnImport" title="Importar">⬆</button>
        <button id="btnLoadTemario" title="Cargar temario">📋</button>
        <button id="btnSyncNow" title="Sincronizar">🔄</button>
        <button id="btnLogoutTop" title="Cerrar sesión">🚪</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <input type="file" id="temarioFile" accept=".json" style="display:none">
    </header>

    <!-- PANELES -->
    <!-- Panel Sesión (contiene la nueva estructura) -->
    <div id="panelSesion" class="panel active">
      <div id="main-area">
        <!-- VISTA IDLE -->
        <div id="idle-view">
          <div class="card config-card">
            <h3>Configuración de la sesión</h3>
            <div class="grid-2">
              <div><label>Fase</label><select id="selFase"><option value="A">A</option><option value="B0">B0</option><option value="B1">B1</option></select></div>
              <div><label>Modo</label><select id="selModo"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="EXT-S">EXT-S</option></select></div>
              <div><label>Materia</label><select id="selMateria"></select></div>
              <div><label>Subtema</label><select id="selSubtema"></select></div>
            </div>
            <div id="agregarMateriaRow" style="display:none; margin-top:6px;"><input type="text" id="nuevaMateria" placeholder="Nueva materia"><button id="btnAgregarMateria">Agregar</button></div>
            <div id="agregarSubtemaRow" style="display:none; margin-top:6px;"><input type="text" id="nuevoSubtema" placeholder="Nuevo subtema"><button id="btnAgregarSubtema">Agregar</button></div>
          </div>
          <div class="card pomo-card">
            <h3>Pomodoro</h3>
            <div class="pomo-circle" id="pomoCircle">90:00</div>
            <div id="pomoStatus">Foco</div>
            <div class="btn-row" id="pomoControls">
              <button class="primary" id="btnPomoStart">Iniciar</button>
              <button id="btnPomoPause" style="display:none;">Pausar</button>
              <button id="btnPomoResume" style="display:none;">Reanudar</button>
              <button id="btnPomoStop" class="danger" style="display:none;">Detener</button>
              <button id="btnPomoReset" style="display:none;">Reiniciar</button>
            </div>
            <div class="grid-2">
              <div><label>Foco (min)</label><input type="number" id="pomoWork" value="90" min="1"></div>
              <div><label>Descanso (min)</label><input type="number" id="pomoBreak" value="20" min="1"></div>
              <div><label>Lectura</label><div class="btn-row"><button id="btnLecturaStart">▶</button><button id="btnLecturaStop">⏹</button><span id="lecturaAcumulado" class="mono">0:00</span></div></div>
            </div>
            <button id="btnDistraje" class="action-btn" style="margin-top:8px;">Me distraje</button>
          </div>
        </div>

        <!-- VISTA ACTIVA -->
        <div id="active-view" style="display:none;">
          <div id="pomo-float">
            <span id="pomoFloatTime" class="timer">90:00</span>
            <button id="btnPomoPauseFloat">⏯</button>
            <button id="btnPomoStopFloat">⏹</button>
            <button id="btnPomoResetFloat">🔄</button>
            <button id="btnLecturaToggleFloat" title="Lectura">📖 <span id="lecturaAcumuladoFloat">0:00</span></button>
            <button id="btnDistrajeFloat" title="Me distraje (tecla 'd')">⚠</button>
          </div>

          <div id="left-panel" class="card">
            <h4>Historial de <span id="nombreSubtemaHistorial">—</span></h4>
            <div class="table-wrap" id="historialSubtemaTableWrap"></div>
          </div>

          <div id="central-zone">
            <div id="problema-config" class="btn-row">
              <div id="input-num-problema">
                <label>N.º Problema</label>
                <input type="number" id="numProblema" value="1" min="1">
              </div>
              <div id="sel-problema-pendiente" style="display:none;">
                <label>Problema pendiente</label>
                <select id="selProblemaPendiente"></select>
              </div>
              <div>
                <label>Tipo de problema</label>
                <select id="selTipoProblema">
                  <option value="practica">Práctica</option>
                  <option value="eval_inmediata">Eval. inmediata</option>
                  <option value="eval_diferida">Eval. diferida</option>
                  <option value="colchon">Colchón</option>
                </select>
              </div>
            </div>

            <div class="timer-display" id="timerDisplay">00:00.0</div>
            <div id="timerLabel">En pausa</div>

            <div id="conjetura-inline" class="conjecture-line">
              <label>Conjetura</label>
              <input type="text" id="textoConjetura" placeholder="Escribe tu conjetura...">
              <button id="btnGuardarConjetura" class="primary small">Guardar</button>
            </div>

            <div id="cardResultado" class="card" style="display:none;">
              <h3>Resultado</h3>
              <div id="tiempoMostrado"></div>
              <!-- Formulario modo A -->
              <div id="formResultadoA">
                <div class="grid-2">
                  <div>
                    <label>Resultado</label>
                    <div class="toggle-group" id="toggleResultado">
                      <button class="toggle-btn" data-val="bien">Bien</button>
                      <button class="toggle-btn" data-val="mal">Mal</button>
                      <button class="toggle-btn" data-val="no_resuelto">No resuelto</button>
                    </div>
                  </div>
                  <div id="divCodigoError" style="display:none;"><label>Error</label><select id="selCodigoError"></select></div>
                  <div id="divConfianza"><label>Confianza</label><select id="selConfianza"><option value="3" selected>3</option><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="5">5</option></select></div>
                  <div><label>Bloom</label><select id="selBloom"><option value="3" selected>3</option><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div>
                  <div><label>Dificultad</label><select id="selDifExp"><option value="3" selected>3</option><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="5">5</option></select></div>
                  <div><label>Intentos</label><input type="number" id="numIntentos" value="1" min="1"></div>
                </div>
                <div class="btn-row"><button id="btnDescartarProblema">Descartar</button><button id="btnSiguienteProblema" class="primary">Siguiente problema</button></div>
              </div>
              <!-- Formulario modo B -->
              <div id="formResultadoB" style="display:none;">
                <div class="grid-2">
                  <div><label>Calificación</label><div class="toggle-group" id="toggleCalificacion"><button class="toggle-btn" data-val="1">Again</button><button class="toggle-btn" data-val="2">Hard</button><button class="toggle-btn" data-val="3">Good</button><button class="toggle-btn" data-val="4">Easy</button></div></div>
                  <div><label><input type="checkbox" id="chkConsultoSolucion" style="width:auto;"> Consulté solución/pista</label></div>
                </div>
                <div class="btn-row"><button id="btnDescartarRepaso">Descartar</button><button id="btnGuardarRepaso" class="primary">Guardar repaso</button></div>
              </div>
            </div>

            <div id="conjeturas-sesion-wrap" class="card" style="display:none;">
              <h3>Conjeturas de la sesión</h3>
              <div id="listaConjeturasSesion"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Otros paneles (Historial, Progreso, etc.) -->
    <div class="panel" id="panelHistorial"><div class="card" id="historialContainer"></div></div>
    <div class="panel" id="panelProgreso"><div class="card" id="progresoTemaTableWrap"></div></div>
    <div class="panel" id="panelMetricas">
      <!-- ... contenido de métricas ... -->
    </div>
    <!-- ... resto de paneles ... -->
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="codigo.js"></script>
</body>
</html>
